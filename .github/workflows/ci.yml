name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
 
      - name: Lint with ruff
        run: |
          cd backend
          ruff check .
      
      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v || true
